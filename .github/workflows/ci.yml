name: ci

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions: {}

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup .NET
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: 10.0.x
          cache: true
          cache-dependency-path: '**/packages.lock.json'

      - name: Restore
        run: dotnet restore GenAIPlatform.slnx --locked-mode

      - name: Build
        run: dotnet build GenAIPlatform.slnx --configuration Release --no-restore

      - name: Format
        run: dotnet format GenAIPlatform.slnx --verify-no-changes --verbosity minimal

      - name: Code organization gate
        shell: pwsh
        run: ./scripts/code-organization-gate.ps1

      - name: Vulnerability scan
        shell: pwsh
        run: ./scripts/package-vulnerability-gate.ps1

      - name: Test
        env:
          GENAI_REQUIRE_DOCKER_TESTS: "true"
        run: dotnet test --solution GenAIPlatform.slnx --configuration Release --no-build
