name: dependabot lock files

on:
  pull_request:
    types:
      - opened
      - reopened
      - synchronize
    branches:
      - main
    paths:
      - Directory.Packages.props
      - '**/packages.lock.json'

permissions: {}

concurrency:
  group: dependabot-lockfiles-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  prepare:
    if: >-
      github.actor == 'dependabot[bot]' &&
      github.event.pull_request.user.login == 'dependabot[bot]' &&
      github.repository == 'ilagutin/dotnet-genai-starter' &&
      github.event.pull_request.head.repo.full_name == 'ilagutin/dotnet-genai-starter' &&
      github.event.pull_request.base.ref == 'main' &&
      startsWith(github.event.pull_request.head.ref, 'dependabot/nuget/')
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      artifact-name: ${{ steps.classify.outputs.artifact-name }}
      drift: ${{ steps.classify.outputs.drift }}

    steps:
      - name: Checkout exact Dependabot revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Validate event and complete pull request diff
        shell: bash
        env:
          EXPECTED_ACTOR: ${{ github.actor }}
          EXPECTED_AUTHOR: ${{ github.event.pull_request.user.login }}
          EXPECTED_BASE_REF: ${{ github.event.pull_request.base.ref }}
          EXPECTED_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          EXPECTED_HEAD_REF: ${{ github.event.pull_request.head.ref }}
          EXPECTED_HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
          EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          EXPECTED_REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail

          allowed_lock() {
            case "$1" in
              src/GenAIPlatform.Api/packages.lock.json | \
              src/GenAIPlatform.Application.Agentic/packages.lock.json | \
              src/GenAIPlatform.Application.Core/packages.lock.json | \
              src/GenAIPlatform.Application.Evaluations/packages.lock.json | \
              src/GenAIPlatform.Application.Generation/packages.lock.json | \
              src/GenAIPlatform.Application.Knowledge/packages.lock.json | \
              src/GenAIPlatform.Application.Usage/packages.lock.json | \
              src/GenAIPlatform.Domain/packages.lock.json | \
              src/GenAIPlatform.Evaluations/packages.lock.json | \
              src/GenAIPlatform.Infrastructure/packages.lock.json | \
              src/GenAIPlatform.Mcp/packages.lock.json | \
              src/GenAIPlatform.Worker/packages.lock.json | \
              tests/GenAIPlatform.IntegrationTests/packages.lock.json | \
              tests/GenAIPlatform.UnitTests/packages.lock.json)
                return 0
                ;;
              *)
                return 1
                ;;
            esac
          }

          [[ "$EXPECTED_ACTOR" == 'dependabot[bot]' ]]
          [[ "$EXPECTED_AUTHOR" == 'dependabot[bot]' ]]
          [[ "$EXPECTED_REPOSITORY" == 'ilagutin/dotnet-genai-starter' ]]
          [[ "$EXPECTED_HEAD_REPOSITORY" == "$EXPECTED_REPOSITORY" ]]
          [[ "$EXPECTED_BASE_REF" == 'main' ]]
          [[ "$EXPECTED_HEAD_REF" == dependabot/nuget/* ]]
          [[ "$EXPECTED_HEAD_REF" =~ ^dependabot/nuget/[A-Za-z0-9._/-]+$ ]]
          [[ "$EXPECTED_HEAD_REF" != *'..'* ]]
          [[ "$EXPECTED_HEAD_REF" != *'@{'* ]]
          git check-ref-format "refs/heads/$EXPECTED_HEAD_REF"
          [[ "$EXPECTED_BASE_SHA" =~ ^[0-9a-fA-F]{40}$ ]]
          [[ "$EXPECTED_HEAD_SHA" =~ ^[0-9a-fA-F]{40}$ ]]
          [[ "$(git rev-parse HEAD)" == "$EXPECTED_HEAD_SHA" ]]
          git cat-file -e "$EXPECTED_BASE_SHA^{commit}"
          git cat-file -e "$EXPECTED_HEAD_SHA^{commit}"
          git diff --cached --quiet
          [[ -z "$(git status --porcelain=v1 --untracked-files=all)" ]]

          changed=0
          while IFS= read -r -d '' status && IFS= read -r -d '' path; do
            [[ "$status" == 'M' ]]
            if [[ "$path" != 'Directory.Packages.props' ]] && ! allowed_lock "$path"; then
              echo "Unexpected pull request path: $path" >&2
              exit 1
            fi
            [[ "$(git ls-tree "$EXPECTED_HEAD_SHA" -- "$path" | awk '{print $1}')" == '100644' ]]
            [[ -f "$path" && ! -L "$path" ]]
            if allowed_lock "$path"; then
              [[ "$(stat -c %s -- "$path")" -le 1048576 ]]
              jq empty "$path"
            fi
            changed=$((changed + 1))
          done < <(git diff --name-status -z --no-renames "$EXPECTED_BASE_SHA...$EXPECTED_HEAD_SHA")

          [[ "$changed" -gt 0 ]]

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x
          cache: true
          cache-dependency-path: '**/packages.lock.json'

      - name: Regenerate and verify complete lock graph
        run: |
          set -euo pipefail
          dotnet restore GenAIPlatform.slnx --force-evaluate
          dotnet restore GenAIPlatform.slnx --locked-mode

      - name: Validate and collect lock-file drift
        id: classify
        shell: bash
        env:
          ARTIFACT_NAME: dependabot-lockfiles-${{ github.event.pull_request.number }}-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          set -euo pipefail

          allowed_lock() {
            case "$1" in
              src/GenAIPlatform.Api/packages.lock.json | \
              src/GenAIPlatform.Application.Agentic/packages.lock.json | \
              src/GenAIPlatform.Application.Core/packages.lock.json | \
              src/GenAIPlatform.Application.Evaluations/packages.lock.json | \
              src/GenAIPlatform.Application.Generation/packages.lock.json | \
              src/GenAIPlatform.Application.Knowledge/packages.lock.json | \
              src/GenAIPlatform.Application.Usage/packages.lock.json | \
              src/GenAIPlatform.Domain/packages.lock.json | \
              src/GenAIPlatform.Evaluations/packages.lock.json | \
              src/GenAIPlatform.Infrastructure/packages.lock.json | \
              src/GenAIPlatform.Mcp/packages.lock.json | \
              src/GenAIPlatform.Worker/packages.lock.json | \
              tests/GenAIPlatform.IntegrationTests/packages.lock.json | \
              tests/GenAIPlatform.UnitTests/packages.lock.json)
                return 0
                ;;
              *)
                return 1
                ;;
            esac
          }

          git diff --cached --quiet
          [[ -z "$(git ls-files --others --exclude-standard)" ]]

          artifact_dir="$RUNNER_TEMP/$ARTIFACT_NAME"
          mkdir -p -- "$artifact_dir"
          count=0
          total=0
          while IFS= read -r -d '' status && IFS= read -r -d '' path; do
            [[ "$status" == 'M' ]]
            allowed_lock "$path"
            [[ "$(git ls-files --stage -- "$path" | awk '{print $1}')" == '100644' ]]
            [[ -f "$path" && ! -L "$path" ]]
            size="$(stat -c %s -- "$path")"
            [[ "$size" -le 1048576 ]]
            total=$((total + size))
            [[ "$total" -le 5242880 ]]
            jq empty "$path"
            mkdir -p -- "$artifact_dir/$(dirname -- "$path")"
            cp -- "$path" "$artifact_dir/$path"
            count=$((count + 1))
            [[ "$count" -le 14 ]]
          done < <(git diff --name-status -z --no-renames)

          echo "artifact-name=$ARTIFACT_NAME" >> "$GITHUB_OUTPUT"
          if [[ "$count" -eq 0 ]]; then
            echo 'drift=false' >> "$GITHUB_OUTPUT"
          else
            echo 'drift=true' >> "$GITHUB_OUTPUT"
          fi

      - name: Upload validated lock-file drift
        if: steps.classify.outputs.drift == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ steps.classify.outputs.artifact-name }}
          path: ${{ runner.temp }}/${{ steps.classify.outputs.artifact-name }}
          if-no-files-found: error
          retention-days: 1

  push:
    needs: prepare
    if: >-
      needs.prepare.outputs.drift == 'true' &&
      github.actor == 'dependabot[bot]' &&
      github.event.pull_request.user.login == 'dependabot[bot]' &&
      github.repository == 'ilagutin/dotnet-genai-starter' &&
      github.event.pull_request.head.repo.full_name == 'ilagutin/dotnet-genai-starter' &&
      github.event.pull_request.base.ref == 'main' &&
      startsWith(github.event.pull_request.head.ref, 'dependabot/nuget/')
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout exact Dependabot revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Revalidate event and checkout
        shell: bash
        env:
          EXPECTED_ACTOR: ${{ github.actor }}
          EXPECTED_AUTHOR: ${{ github.event.pull_request.user.login }}
          EXPECTED_BASE_REF: ${{ github.event.pull_request.base.ref }}
          EXPECTED_HEAD_REF: ${{ github.event.pull_request.head.ref }}
          EXPECTED_HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
          EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          EXPECTED_REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          [[ "$EXPECTED_ACTOR" == 'dependabot[bot]' ]]
          [[ "$EXPECTED_AUTHOR" == 'dependabot[bot]' ]]
          [[ "$EXPECTED_REPOSITORY" == 'ilagutin/dotnet-genai-starter' ]]
          [[ "$EXPECTED_HEAD_REPOSITORY" == "$EXPECTED_REPOSITORY" ]]
          [[ "$EXPECTED_BASE_REF" == 'main' ]]
          [[ "$EXPECTED_HEAD_REF" == dependabot/nuget/* ]]
          [[ "$EXPECTED_HEAD_REF" =~ ^dependabot/nuget/[A-Za-z0-9._/-]+$ ]]
          [[ "$EXPECTED_HEAD_REF" != *'..'* ]]
          [[ "$EXPECTED_HEAD_REF" != *'@{'* ]]
          git check-ref-format "refs/heads/$EXPECTED_HEAD_REF"
          [[ "$EXPECTED_HEAD_SHA" =~ ^[0-9a-fA-F]{40}$ ]]
          [[ "$(git rev-parse HEAD)" == "$EXPECTED_HEAD_SHA" ]]
          git diff --cached --quiet
          [[ -z "$(git status --porcelain=v1 --untracked-files=all)" ]]

      - name: Download generated lock files
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ needs.prepare.outputs.artifact-name }}
          path: ${{ runner.temp }}/${{ needs.prepare.outputs.artifact-name }}

      - name: Validate, copy and stage artifact files
        id: stage
        shell: bash
        env:
          ARTIFACT_NAME: ${{ needs.prepare.outputs.artifact-name }}
          EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail

          allowed_lock() {
            case "$1" in
              src/GenAIPlatform.Api/packages.lock.json | \
              src/GenAIPlatform.Application.Agentic/packages.lock.json | \
              src/GenAIPlatform.Application.Core/packages.lock.json | \
              src/GenAIPlatform.Application.Evaluations/packages.lock.json | \
              src/GenAIPlatform.Application.Generation/packages.lock.json | \
              src/GenAIPlatform.Application.Knowledge/packages.lock.json | \
              src/GenAIPlatform.Application.Usage/packages.lock.json | \
              src/GenAIPlatform.Domain/packages.lock.json | \
              src/GenAIPlatform.Evaluations/packages.lock.json | \
              src/GenAIPlatform.Infrastructure/packages.lock.json | \
              src/GenAIPlatform.Mcp/packages.lock.json | \
              src/GenAIPlatform.Worker/packages.lock.json | \
              tests/GenAIPlatform.IntegrationTests/packages.lock.json | \
              tests/GenAIPlatform.UnitTests/packages.lock.json)
                return 0
                ;;
              *)
                return 1
                ;;
            esac
          }

          [[ "$ARTIFACT_NAME" =~ ^dependabot-lockfiles-[0-9]+-[0-9]+-[0-9]+$ ]]
          [[ "$(git rev-parse HEAD)" == "$EXPECTED_HEAD_SHA" ]]
          git diff --cached --quiet
          [[ -z "$(git status --porcelain=v1 --untracked-files=all)" ]]

          artifact_dir="$RUNNER_TEMP/$ARTIFACT_NAME"
          [[ -d "$artifact_dir" && ! -L "$artifact_dir" ]]
          [[ -z "$(find "$artifact_dir" -mindepth 1 ! -type f ! -type d -print -quit)" ]]

          lock_paths=()
          total=0
          while IFS= read -r -d '' file; do
            path="${file#"$artifact_dir"/}"
            [[ "$path" != "$file" ]]
            allowed_lock "$path"
            [[ -f "$file" && ! -L "$file" ]]
            [[ "$(git ls-files --stage -- "$path" | awk '{print $1}')" == '100644' ]]
            [[ -f "$path" && ! -L "$path" ]]
            size="$(stat -c %s -- "$file")"
            [[ "$size" -le 1048576 ]]
            total=$((total + size))
            [[ "$total" -le 5242880 ]]
            jq empty "$file"
            lock_paths+=("$path")
            [[ "${#lock_paths[@]}" -le 14 ]]
          done < <(find "$artifact_dir" -type f -print0)

          [[ "${#lock_paths[@]}" -gt 0 ]]
          for path in "${lock_paths[@]}"; do
            cp -- "$artifact_dir/$path" "$path"
          done
          git add -- "${lock_paths[@]}"
          git diff --cached --check
          git diff --quiet
          [[ -z "$(git ls-files --others --exclude-standard)" ]]

          staged=0
          while IFS= read -r -d '' status && IFS= read -r -d '' path; do
            [[ "$status" == 'M' ]]
            allowed_lock "$path"
            found=false
            for expected in "${lock_paths[@]}"; do
              if [[ "$path" == "$expected" ]]; then
                found=true
                break
              fi
            done
            [[ "$found" == 'true' ]]
            staged=$((staged + 1))
          done < <(git diff --cached --name-status -z --no-renames)
          [[ "$staged" -eq "${#lock_paths[@]}" ]]

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          empty_hooks="$RUNNER_TEMP/empty-git-hooks"
          mkdir -p -- "$empty_hooks"
          git -c core.hooksPath="$empty_hooks" -c commit.gpgSign=false \
            commit --no-verify -m 'chore(deps): update dependency lock files'
          [[ "$(git rev-parse HEAD^)" == "$EXPECTED_HEAD_SHA" ]]
          [[ -z "$(git status --porcelain=v1 --untracked-files=all)" ]]

      - name: Push validated lock-file commit
        shell: bash
        env:
          DEPENDABOT_LOCKFILE_TOKEN: ${{ secrets.DEPENDABOT_LOCKFILE_TOKEN }}
          EXPECTED_HEAD_REF: ${{ github.event.pull_request.head.ref }}
          EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          [[ -n "$DEPENDABOT_LOCKFILE_TOKEN" ]] || {
            echo 'DEPENDABOT_LOCKFILE_TOKEN is unavailable; use the documented manual remediation.' >&2
            exit 1
          }
          [[ "$EXPECTED_HEAD_REF" == dependabot/nuget/* ]]
          [[ "$EXPECTED_HEAD_REF" =~ ^dependabot/nuget/[A-Za-z0-9._/-]+$ ]]
          [[ "$EXPECTED_HEAD_REF" != *'..'* ]]
          [[ "$EXPECTED_HEAD_REF" != *'@{'* ]]
          git check-ref-format "refs/heads/$EXPECTED_HEAD_REF"
          [[ "$EXPECTED_HEAD_SHA" =~ ^[0-9a-fA-F]{40}$ ]]
          [[ "$(git rev-parse HEAD^)" == "$EXPECTED_HEAD_SHA" ]]
          [[ -z "$(git status --porcelain=v1 --untracked-files=all)" ]]

          askpass="$(mktemp "$RUNNER_TEMP/dependabot-askpass.XXXXXX")"
          trap 'rm -f -- "$askpass"' EXIT
          printf '%s\n' \
            '#!/bin/sh' \
            'case "$1" in' \
            '  *Username*) printf "%s\\n" "x-access-token" ;;' \
            '  *Password*) printf "%s\\n" "$DEPENDABOT_LOCKFILE_TOKEN" ;;' \
            '  *) exit 1 ;;' \
            'esac' > "$askpass"
          chmod 700 "$askpass"

          repository_url='https://github.com/ilagutin/dotnet-genai-starter.git'
          remote_sha="$(GIT_ASKPASS="$askpass" GIT_TERMINAL_PROMPT=0 \
            git ls-remote --exit-code "$repository_url" "refs/heads/$EXPECTED_HEAD_REF" | \
            awk 'NR == 1 { print $1 }')"
          [[ "$remote_sha" == "$EXPECTED_HEAD_SHA" ]]
          GIT_ASKPASS="$askpass" GIT_TERMINAL_PROMPT=0 \
            git push --no-verify "$repository_url" "HEAD:refs/heads/$EXPECTED_HEAD_REF"
